  <style>
    :root {
      color-scheme: light;
      --ink: #192a28;
      --muted: #667471;
      --paper: #f4f6f1;
      --white: #fff;
      --line: #e2e8e1;
      --green: #173c35;
      --green-light: #e4eee7;
      --orange: #e5784d;
      --yellow: #f1c66d;
      --shadow: 0 16px 40px rgb(26 48 42 / 8%);
      --page-pattern: radial-gradient(#dce5dc 0.7px, transparent 0.7px);
      font-family: "IBM Plex Sans Arabic", "DM Sans", Tahoma, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #e5ece8;
      --muted: #aab8b1;
      --paper: #151e1b;
      --white: #202b27;
      --line: #35423d;
      --green: #315b4e;
      --green-light: #293d35;
      --orange: #ef956d;
      --yellow: #f1c66d;
      --shadow: 0 16px 40px rgb(0 0 0 / 18%);
      --page-pattern: radial-gradient(rgb(255 255 255 / 5%) 0.7px, transparent 0.7px);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: var(--page-pattern);
      background-size: 17px 17px;
    }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .masthead {
      position: relative;
      overflow: hidden;
      color: #fff;
      background: var(--green);
      isolation: isolate;
    }

    .masthead::before {
      position: absolute;
      z-index: -1;
      inset: 0 48% 0 0;
      content: "";
      opacity: .18;
      background-image: linear-gradient(135deg, transparent 49.5%, #a3c3a9 50%, transparent 50.5%);
      background-size: 34px 34px;
      mask-image: linear-gradient(90deg, transparent, #000);
    }

    .masthead-inner, main, footer {
      width: min(1080px, calc(100% - 48px));
      margin-inline: auto;
    }

    .masthead-inner { padding-block: 32px 38px; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 37px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: inherit;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgb(255 255 255 / 30%);
      border-radius: 9px;
      color: var(--yellow);
      font-family: "DM Sans", sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .share-button, .tool-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid rgb(255 255 255 / 30%);
      border-radius: 6px;
      color: #fff;
      background: transparent;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }

    .share-button:hover, .tool-button:hover { border-color: #fff; background: rgb(255 255 255 / 9%); }
    .share-icon { font-size: 18px; line-height: 1; }
    .tool-icon { font-size: 16px; line-height: 1; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #bdd1c2;
      font-size: 13px;
      font-weight: 500;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 43px);
      font-weight: 600;
      line-height: 1.25;
    }

    .intro-copy {
      margin: 10px 0 0;
      color: #d1ded3;
      font-size: 15px;
    }

    .total {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding: 11px 15px;
      border: 1px solid rgb(255 255 255 / 21%);
      border-radius: 7px;
      white-space: nowrap;
    }

    .total strong { color: var(--yellow); font-family: "DM Sans", sans-serif; font-size: 23px; }
    .total span { color: #d1ded3; font-size: 13px; }

    main { padding-block: 28px 50px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 19px;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 7px; }

    .filter {
      min-height: 37px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #586762;
      background: transparent;
      cursor: pointer;
      transition: color .18s, background .18s, border-color .18s;
    }

    .filter:hover { border-color: #d4ded4; }
    .filter[aria-pressed="true"] { border-color: var(--green); color: #fff; background: var(--green); }
    .filter:disabled { border-color: var(--line); color: var(--muted); background: var(--white); cursor: not-allowed; }

    .soon-label {
      display: inline-block;
      margin-inline-start: 4px;
      padding: 1px 5px;
      border: 1px solid color-mix(in srgb, var(--orange) 35%, transparent);
      border-radius: 3px;
      color: var(--orange);
      font-size: 10px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
      width: min(310px, 100%);
      flex: 0 1 310px;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      inset-inline-start: 13px;
      color: #75827e;
      font-size: 18px;
      transform: translateY(-52%);
      pointer-events: none;
    }

    .search {
      width: 100%;
      height: 42px;
      padding-inline: 40px 13px;
      border: 1px solid #dce4db;
      border-radius: 6px;
      outline: none;
      color: var(--ink);
      background: var(--white);
      transition: border-color .18s, box-shadow .18s;
    }

    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: #508573; box-shadow: 0 0 0 3px rgb(80 133 115 / 15%); }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 35px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .list-heading strong { color: var(--ink); font-weight: 600; }

    .file-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .file-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 86px;
      padding: 14px 19px;
      border-bottom: 1px solid var(--line);
      animation: arrive .35s both;
    }

    .file-row:last-child { border-bottom: 0; }

    .file-info { display: flex; min-width: 0; align-items: center; gap: 14px; }

    .pdf-mark {
      display: grid;
      width: 42px;
      height: 48px;
      flex: 0 0 42px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--orange) 24%, transparent);
      border-radius: 5px;
      color: #bd573b;
      background: color-mix(in srgb, var(--orange) 9%, var(--white));
      font-family: "DM Sans", sans-serif;
      font-size: 10px;
      font-weight: 700;
    }

    .file-copy { min-width: 0; }

    .file-name {
      overflow-wrap: anywhere;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.55;
    }

    .file-name-link {
      display: inline-block;
      max-width: 100%;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--ink);
      background: var(--white);
      overflow-wrap: anywhere;
      text-decoration: none;
      transition: border-color .18s, background .18s;
    }

    .file-name-link:hover { border-color: #99b3a4; background: var(--green-light); }
    .file-name-link:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

    .file-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .file-category {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .file-category::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      content: "";
      background: var(--orange);
    }

    .file-actions { display: flex; align-items: center; gap: 8px; }

    .action {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--ink);
      background: var(--white);
      font-size: 13px;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color .18s, color .18s, background .18s;
    }

    .action:hover { border-color: #99b3a4; color: var(--ink); background: var(--green-light); }
    .action.primary { border-color: var(--green); color: #fff; background: var(--green); }
    .action.primary:hover { border-color: #24594d; background: #24594d; }
    .action-icon { font-size: 16px; line-height: 1; }

    .empty-state {
      padding: 52px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 16px; }
    .empty-state[hidden] { display: none; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-block: 0 25px;
      color: var(--muted);
      font-size: 12px;
    }

    #toast {
      position: fixed;
      z-index: 5;
      right: 50%;
      bottom: 22px;
      max-width: calc(100% - 32px);
      padding: 11px 16px;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 6px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 8px 24px rgb(20 38 33 / 22%);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translate(50%, 8px);
      transition: opacity .2s, transform .2s;
    }

    #toast.visible { opacity: 1; transform: translate(50%, 0); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 700px) {
      .masthead-inner, main, footer { width: min(100% - 32px, 560px); }
      .masthead-inner { padding-block: 20px 27px; }
      .topline { margin-bottom: 27px; }
      .intro { grid-template-columns: minmax(0, 1fr); align-items: start; gap: 17px; }
      .total { width: fit-content; padding: 7px 11px; }
      main { padding-block: 20px 34px; }
      .toolbar { align-items: stretch; flex-direction: column-reverse; gap: 13px; }
      .search-wrap { width: 100%; flex: auto; }
      .filters { gap: 5px; }
      .filter { min-height: 34px; padding-inline: 10px; font-size: 13px; }
      .file-row { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 13px; }
      .file-info { align-items: flex-start; gap: 11px; }
      .pdf-mark { width: 37px; height: 43px; flex-basis: 37px; }
      .file-name { font-size: 14px; }
      .file-actions { padding-inline-start: 48px; }
      .action { min-height: 35px; padding-inline: 10px; }
      footer { flex-direction: column; gap: 3px; }
    }

    @media (max-width: 380px) {
      .masthead-inner, main, footer { width: calc(100% - 24px); }
      .brand { font-size: 14px; }
      .share-button, .tool-button { padding-inline: 9px; font-size: 12px; }
      .filter { padding-inline: 8px; font-size: 12px; }
      .file-actions { padding-inline-start: 0; }
      .action { flex: 1; }
    }

    /* Keep native form controls aligned with the selected theme. */
    :root[data-theme="dark"] .search { border-color: var(--line); }
    :root[dir="ltr"] .file-actions { justify-content: flex-start; }
  </style>
</head>

        footerFiles: "ملفات PDF",
        footerUnit: "ملف",
        openFile: "افتح الملف",
        viewFile: "عرض الملف",
        download: "تنزيل",
        themeNight: "الوضع الليلي",
        themeDay: "الوضع النهاري",
        localShare: "ارفع المكتبة على الإنترنت لمشاركة رابطها",
        copied: "تم نسخ رابط المكتبة",
        manualCopy: "انسخ رابط الصفحة من شريط العنوان",
        shareText: "ملفات المحاضرات والمراجعة في مكان واحد"
      },
      en: {
        siteTitle: "Course Library",
        description: "A library of lecture notes, revision materials, and course PDFs.",
        homeLabel: "Course Library home",
        totalAria: "Number of files",
        brand: "Course Library",
        share: "Share",
        eyebrow: "Lectures and revision materials",
        heroTitle: "All your course files, in one place.",
        heroCopy: "Browse, open, or download your files.",
        totalLabel: "PDF files",
        filterGroup: "Filter by subject",
        filterAll: "All files",
        filterFinance: "Financial management",
        filterEstablishments: "Establishments",
        filterReview: "Revision",
        filterCenters: "Study centers",
        filterTaxes: "Tax",
        filterCosts: "Cost accounting",
        comingSoon: "Coming soon",
        taxesSoon: "Tax, coming soon",
        costsSoon: "Cost accounting, coming soon",
        searchPlaceholder: "Search file names...",
        searchLabel: "Search file names",
        listTitle: "Files",
        fileListLabel: "File list",
        emptyTitle: "No matching files",
        emptyCopy: "Try a different search or select another category.",
        noCenters: "No study or memo files found yet.",
        footerFiles: "PDF files",
        footerUnit: "files",
        openFile: "Open file",
        viewFile: "View file",
        download: "Download",
        themeNight: "Dark mode",
        themeDay: "Light mode",
        localShare: "Upload the library online before sharing its link",
        copied: "Library link copied",
        manualCopy: "Copy the page link from the address bar",
        shareText: "Lectures and revision materials in one place"
      }
    };

    const list = document.getElementById("fileList");
    const searchInput = document.getElementById("searchInput");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");
    const filters = [...document.querySelectorAll(".filter")];
    const root = document.documentElement;
    let activeFilter = "all";
    let language = "ar";
    let theme = "light";
    let toastTimeout;

    function readPreference(key, fallback) {
      try {
        return localStorage.getItem(key) || fallback;
      } catch {
        return fallback;
      }
    }

    function savePreference(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch {
        return;
      }
    }

    language = readPreference("library-language", "ar");
    if (!translations[language]) language = "ar";
    theme = readPreference("library-theme", "light");
    if (theme !== "dark" && theme !== "light") theme = "light";

    function currentText() {
      return translations[language];
    }

    function fileCategory(file) {
      const isStudyCenterFile = file.name.includes("مذاكرة")
        || file.name.includes("مذكرة")
        || file.name === "الشوبكي- مالية -1.pdf";
      return isStudyCenterFile ? "centers" : file.category;
    }

    function formatSize(bytes) {
      const locale = language === "ar" ? "ar-EG" : "en";
      const size = (bytes / 1048576).toLocaleString(locale, { maximumFractionDigits: 1 });
      return language === "ar" ? `${size} م.ب` : `${size} MB`;
    }

    function applyLanguage() {
      const text = currentText();
      root.lang = language;
      root.dir = language === "ar" ? "rtl" : "ltr";
      document.title = text.siteTitle;
      document.querySelector('meta[name="description"]').content = text.description;
      document.querySelector('meta[property="og:title"]').content = `${text.siteTitle} | ${text.heroTitle}`;
      document.querySelector('meta[property="og:description"]').content = text.description;
      document.querySelector('meta[name="twitter:title"]').content = `${text.siteTitle} | ${text.heroTitle}`;
      document.querySelector('meta[name="twitter:description"]').content = text.description;

      for (const element of document.querySelectorAll("[data-i18n]")) {
        element.textContent = text[element.dataset.i18n];
      }
      for (const element of document.querySelectorAll("[data-i18n-placeholder]")) {
        element.placeholder = text[element.dataset.i18nPlaceholder];
      }
      for (const element of document.querySelectorAll("[data-i18n-aria]")) {
        element.setAttribute("aria-label", text[element.dataset.i18nAria]);
      }

      document.querySelector(".brand-mark").textContent = language === "ar" ? "م" : "C";
      document.getElementById("languageLabel").textContent = language === "ar" ? "English" : "العربية";
      document.getElementById("languageButton").setAttribute("aria-label", language === "ar" ? "Switch language to English" : "تغيير اللغة إلى العربية");
      document.getElementById("footerLabel").textContent = text.footerFiles;
      document.getElementById("footerUnit").textContent = language === "ar" ? "ملف" : (files.length === 1 ? "file" : "files");
      document.getElementById("totalCount").textContent = files.length.toLocaleString(language === "ar" ? "ar-EG" : "en");
      document.getElementById("footerCount").textContent = files.length.toLocaleString(language === "ar" ? "ar-EG" : "en");
      renderFiles();
    }

    function applyTheme() {
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#151e1b" : "#173c35";
      const nextTheme = theme === "dark" ? "light" : "dark";
      document.getElementById("themeIcon").textContent = theme === "dark" ? "☼" : "☾";
      document.getElementById("themeLabel").textContent = currentText()[theme === "dark" ? "themeDay" : "themeNight"];
      document.getElementById("themeButton").setAttribute("aria-label", currentText()[theme === "dark" ? "themeDay" : "themeNight"]);
      document.getElementById("themeButton").dataset.nextTheme = nextTheme;
    }

    function renderFiles() {
      const text = currentText();
      const query = searchInput.value.trim().toLocaleLowerCase(language);
      const visibleFiles = files.filter(file => {
        const categoryKey = fileCategory(file);
        const matchesFilter = activeFilter === "all" || categoryKey === activeFilter;
        const searchableText = `${file.name} ${file.labels.ar} ${file.labels.en}`.toLocaleLowerCase(language);
        return matchesFilter && searchableText.includes(query);
      });

      list.replaceChildren();
      for (const [index, file] of visibleFiles.entries()) {
        const categoryKey = fileCategory(file);
        const row = document.createElement("article");
        row.className = "file-row";
        row.style.animationDelay = `${Math.min(index, 8) * 22}ms`;

        const info = document.createElement("div");
        info.className = "file-info";
        const mark = document.createElement("span");
        mark.className = "pdf-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = "PDF";

        const copy = document.createElement("div");
        copy.className = "file-copy";
        const title = document.createElement("h2");
        title.className = "file-name";
        const open = document.createElement("a");
        const url = `./${encodeURIComponent(file.name)}`;
        open.className = "file-name-link";
        open.href = url;
        open.target = "_blank";
        open.rel = "noopener";
        open.setAttribute("aria-label", `${text.openFile}: ${file.name}`);
        open.textContent = file.name;
        title.append(open);

        const meta = document.createElement("div");
        meta.className = "file-meta";
        const category = document.createElement("span");
        category.className = "file-category";
        category.textContent = categoryKey === "centers" ? text.filterCenters : file.labels[language];
        const size = document.createElement("span");
        size.textContent = formatSize(file.size);
        meta.append(category, size);
        copy.append(title, meta);
        info.append(mark, copy);

        const actions = document.createElement("div");
        actions.className = "file-actions";
        const view = document.createElement("a");
        view.className = "action primary";
        view.href = url;
        view.target = "_blank";
        view.rel = "noopener";
        view.setAttribute("aria-label", `${text.viewFile}: ${file.name}`);
        view.innerHTML = `<span class="action-icon" aria-hidden="true">↗</span><span>${text.viewFile}</span>`;
        const download = document.createElement("a");
        download.className = "action";
        download.href = url;
        download.download = file.name;
        download.setAttribute("aria-label", `${text.download}: ${file.name}`);
        download.innerHTML = `<span class="action-icon" aria-hidden="true">↓</span><span>${text.download}</span>`;
        actions.append(view, download);
        row.append(info, actions);
        list.append(row);
      }

      const locale = language === "ar" ? "ar-EG" : "en";
      resultCount.textContent = language === "ar"
        ? `${visibleFiles.length.toLocaleString(locale)} ملف`
        : `${visibleFiles.length.toLocaleString(locale)} ${visibleFiles.length === 1 ? "file" : "files"}`;
      document.getElementById("footerUnit").textContent = language === "ar" ? "ملف" : (files.length === 1 ? "file" : "files");
      document.getElementById("emptyCopy").textContent = activeFilter === "centers" ? text.noCenters : text.emptyCopy;
      emptyState.hidden = visibleFiles.length !== 0;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove("visible"), 2400);
    }

    searchInput.addEventListener("input", renderFiles);
    for (const filter of filters) {
      filter.addEventListener("click", () => {
        activeFilter = filter.dataset.filter;
        for (const button of filters) button.setAttribute("aria-pressed", String(button === filter));
        renderFiles();
      });
    }

    document.getElementById("languageButton").addEventListener("click", () => {
      language = language === "ar" ? "en" : "ar";
      savePreference("library-language", language);
      applyLanguage();
      applyTheme();
    });

    document.getElementById("themeButton").addEventListener("click", event => {
      theme = event.currentTarget.dataset.nextTheme;
      savePreference("library-theme", theme);
      applyTheme();
    });

    document.getElementById("shareButton").addEventListener("click", async () => {
      if (window.location.protocol === "file:") {
        showToast(currentText().localShare);
        return;
      }

      try {
        if (navigator.share) {
          await navigator.share({ title: document.title, text: currentText().shareText, url: window.location.href });
          return;
        }
        await navigator.clipboard.writeText(window.location.href);
        showToast(currentText().copied);
      } catch (error) {
        if (error.name !== "AbortError") showToast(currentText().manualCopy);
      }
    });

    applyLanguage();
    applyTheme();
  </script>
</body>
</html>
